<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>News Engine — Symbol Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Symbol Impact Dashboard</h1>
  <nav>
    <button id="tab-dashboard" class="tab-btn active">Dashboard</button>
    <button id="tab-calendar" class="tab-btn">Calendar</button>
    <button id="tab-history" class="tab-btn">History</button>
  </nav>
</header>

<section id="view-dashboard">
  <div id="predictions-stale-notice" class="stale-notice" style="display:none"></div>
  <form id="add-symbol-form">
    <input id="add-symbol-input" placeholder="Add symbol e.g. EURUSD" maxlength="6" />
    <button type="submit">Add</button>
  </form>
  <div id="cards" class="cards-grid"></div>
</section>

<section id="view-calendar" style="display:none">
  <div id="calendar-stale-notice" class="stale-notice" style="display:none"></div>
  <div id="calendar-grid"></div>
  <div id="calendar-date-panel" style="display:none">
    <button id="calendar-date-panel-close">✕</button>
    <h3 id="calendar-date-panel-title"></h3>
    <div id="calendar-date-panel-body"></div>
  </div>
</section>

<section id="view-history" style="display:none">
  <div id="history-empty-notice" class="stale-notice" style="display:none">No confirmed calls yet.</div>
  <table id="history-table" style="display:none">
    <thead>
      <tr><th>Event</th><th>Instr.</th><th>Previous</th><th>Forecast</th><th>Actual</th><th>NE Prediction</th><th>Outcome</th></tr>
    </thead>
    <tbody id="history-tbody"></tbody>
  </table>
</section>

<script src="/static/app.js"></script>
</body>
</html>
