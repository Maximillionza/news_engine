Trend Risk"], "correctLabels": ["Trade"], "explanation": "All of Setup 2's components are present \u2014 a valid Trade.", "remediationLessons": ["c4l3"]}, {"image": "scenario-notrade4", "candidateLabels": ["Trade", "No Trade", "Wait for Confirmation", "Missing Setup Component", "Counter-Trend Risk"], "correctLabels": ["No Trade", "Missing Setup Component"], "explanation": "A false break, not a genuine retest \u2014 correctly No Trade.", "remediationLessons": ["c4l3"]}]}}, {"id": "course5", "slug": "advanced-strategies", "title": "Multi-Timeframe Mastery & Advanced Strategies", "tier": "advanced", "paywalled": true, "price": "$6.99 one-time, or included with TradeWise Pro", "description": "The final two confluence setups, the advanced trap library, session risk budgeting and expectancy, and a primer on the strategy frameworks behind the Strategies Pack.", "badgeName": "Gold Learning Badge (requires all 5 courses)", "lessons": [{"id": "c5l1", "title": "Setup 4: Multi-Timeframe Confluence", "slides": [{"heading": "The components", "body": "Component A: a key level visible on the 1H chart. Component B: a market structure shift on the 5M chart right at that 1H level. Component C: a candlestick confirmation on the 5M chart.", "image": "setup4-components"}, {"heading": "Valid buy / valid sell", "body": "Valid BUY: 1H key support, plus a 5M structure shift upward at that level, plus a 5M bullish candle. Valid SELL: 1H key resistance, plus a 5M downward structure shift, plus a 5M bearish candle.", "image": "setup4-valid"}, {"heading": "The trap version", "body": "The 1H level is genuinely there, but the 5M structure hasn't actually shifted yet \u2014 price is still making lower highs against 1H support, for example. Correct call: No Trade, wait for the shift to actually happen.", "image": "setup4-trap"}], "quiz": [{"question": "What are the three components of Setup 4?", "options": ["A 1H key level, a 5M structure shift at that level, and a 5M confirming candle", "Two Fibonacci levels and a volume spike", "A doji and a moving average cross", "Three consecutive 1H candles"], "correctIndex": 0, "explanation": "Setup 4 combines a higher-timeframe level with a lower-timeframe structure shift and confirmation \u2014 true multi-timeframe agreement."}, {"question": "Price is at 1H support, but the 5M chart is still making lower highs with no structure shift yet. What's correct?", "options": ["Buy immediately \u2014 the 1H level is enough on its own", "No Trade \u2014 wait for the 5M structure to actually shift", "Sell \u2014 lower highs mean continuation down", "Increase lot size to compensate for uncertainty"], "correctIndex": 1, "explanation": "Setup 4 needs all three components. A 1H level alone, without a 5M structure shift, is the trap version \u2014 patience is the correct call."}, {"question": "Why is Setup 4 introduced only after Setups 1\u20133?", "options": ["It uses a completely unrelated skill set", "It builds directly on structure-reading (Course 1) and structure breaks (Setup 3), combined across two timeframes at once", "It's easier than the earlier setups", "There's no particular reason"], "correctIndex": 1, "explanation": "Multi-timeframe confluence layers structure-reading and break/retest skills across two timeframes simultaneously \u2014 it depends on the earlier setups being solid first."}]}, {"id": "c5l2", "title": "Setup 5: Compression Breakout", "slides": [{"heading": "The components", "body": "Component A: a narrowing range \u2014 lower highs and higher lows \u2014 visible over 10+ candles on the 5M chart. Component B: a breakout candle closing outside the compression with a body at least 1.5\u00d7 the average body size of the compression period. Component C: the breakout direction aligns with the 15M trend or momentum.", "image": "setup5-components"}, {"heading": "Valid buy / valid sell", "body": "Valid BUY: compression, then a bullish breakout candle closing above the range, with the 15M trend up or neutral. Valid SELL: compression, then a bearish breakout closing below the range, with the 15M confirming.", "image": "setup5-valid"}, {"heading": "The trap version", "body": "A breakout wick pokes outside the range but the candle doesn't close beyond it \u2014 or the breakout fires directly against a strong 1H trend. Both are correctly No Trade.", "image": "setup5-trap"}], "quiz": [{"question": "What defines the 'compression' in Compression Breakout?", "options": ["A single large candle", "A narrowing range \u2014 lower highs and higher lows \u2014 over 10+ candles", "Any sideways price action, regardless of shape", "A gap between two candles"], "correctIndex": 1, "explanation": "Compression specifically means the range is narrowing candle over candle \u2014 lower highs meeting higher lows, squeezing toward a point."}, {"question": "What size does the breakout candle's body need to be, relative to the compression period?", "options": ["Any size at all", "At least 1.5\u00d7 the average body size of the compression candles", "Exactly the same size as the previous candle", "Smaller than the compression candles"], "correctIndex": 1, "explanation": "The breakout needs real conviction behind it \u2014 a body at least 1.5\u00d7 the compression period's average, not just a marginal push outside the range."}, {"question": "A breakout candle wicks outside the compression range but closes back inside it. What's correct?", "options": ["Trade the breakout direction anyway", "No Trade \u2014 the close never confirmed the breakout", "Always trade against the wick", "Increase lot size since volatility is rising"], "correctIndex": 1, "explanation": "Component B requires a close outside the range, not just a wick. Without that close, it's the trap version of Setup 5."}]}, {"id": "c5l3", "title": "Advanced Trap Library", "slides": [{"heading": "False break / liquidity sweep, revisited", "body": "At this level, false breaks get sharper: price can sweep through a level aggressively \u2014 designed to trigger stop losses clustered just beyond it \u2014 before reversing hard the other way.", "image": "advtrap-liquiditysweep"}, {"heading": "Counter-trend traps", "body": "A setup with every local component present, but positioned directly against a strong, well-established higher-timeframe trend. These are the most convincing traps precisely because the local pattern is genuinely clean.", "image": "advtrap-countertrend"}, {"heading": "News-simulation spikes", "body": "A sharp, fast directional move with no structural basis \u2014 no level, no break, no compression. It's volatility without a story. Trading it as if it were a valid setup is a Stage 3+ trap.", "image": "advtrap-newsspike"}], "quiz": [{"question": "What is a liquidity sweep?", "options": ["A slow, gradual price drift", "An aggressive push through a level \u2014 often to trigger clustered stop losses \u2014 before reversing", "A type of candlestick pattern", "A guaranteed reversal signal"], "correctIndex": 1, "explanation": "A liquidity sweep is a sharp move through a level, frequently understood as clearing out stop losses sitting just beyond it, before price reverses."}, {"question": "Why are counter-trend traps described as 'the most convincing'?", "options": ["Because they never actually look valid", "Because the local pattern genuinely is clean \u2014 it's only the higher-timeframe context that makes it a trap", "Because they only occur on weekends", "Because they always involve a doji"], "correctIndex": 1, "explanation": "The local setup can be textbook-correct in isolation \u2014 what makes it a trap is fighting the higher-timeframe trend, which is easy to miss if you only look at the immediate chart."}, {"question": "What structurally distinguishes a news-simulation spike from a valid Setup 5 breakout?", "options": ["Nothing \u2014 they look identical", "The spike has no compression, level, or structural basis behind the move", "It only happens on EUR/USD", "It always aligns with the 15M trend"], "correctIndex": 1, "explanation": "A valid breakout has a structural setup behind it (compression). A news-spike is volatility with no such basis \u2014 trading it as a setup is the trap."}]}, {"id": "c5l4", "title": "Session Risk Budgeting & Expectancy", "slides": [{"heading": "Beyond per-trade risk: the session budget", "body": "The 1% rule caps a single trade. A session risk budget caps how much you're willing to risk across an entire sitting \u2014 a warning triggers if any single trade exceeds 2% of Practice Capital, even though it's not blocked outright.", "image": "advrisk-sessionbudget"}, {"heading": "What an R-multiple is", "body": "An R-multiple expresses a trade's result relative to what you risked. Risk $5 (1R) and make $10, that's a +2R trade. Risk $5 and lose it, that's -1R. Thinking in R lets you compare trades of different sizes fairly.", "image": "advrisk-rmultiple"}, {"heading": "Expectancy, in one line", "body": "Expectancy = (win rate \u00d7 average R won) \u2212 (loss rate \u00d7 average R lost). A positive expectancy system can still have more losing trades than winning ones and be profitable overall \u2014 this is why a single loss (or win) never tells the whole story.", "image": "advrisk-expectancy"}], "quiz": [{"question": "What does a session risk budget add on top of the 1% per-trade rule?", "options": ["Nothing \u2014 they're the same thing", "A ceiling on total risk taken across an entire session, not just one trade", "A guarantee against any losses", "A higher leverage allowance"], "correctIndex": 1, "explanation": "The 1% rule governs one trade; the session budget governs the cumulative risk across everything you do in one sitting."}, {"question": "You risk $5 (1R) and the trade closes at +$15 profit. What R-multiple is that?", "options": ["+1R", "+2R", "+3R", "-1R"], "correctIndex": 2, "explanation": "$15 profit against $5 risked is 3\u00d7 the risk \u2014 a +3R result."}, {"question": "Can a trading system with more losing trades than winning trades still be profitable overall?", "options": ["No \u2014 win rate above 50% is always required", "Yes \u2014 if the average size of wins (in R) sufficiently outweighs the average size of losses", "Only if leverage is very high", "Only in Arcade Mode"], "correctIndex": 1, "explanation": "Expectancy depends on win rate AND average R per win/loss together \u2014 a system that wins less often but wins bigger can still have positive expectancy overall."}]}, {"id": "c5l5", "title": "Intro to Strategy Frameworks", "slides": [{"heading": "Why frameworks, not just setups", "body": "The 5 core setups are individual patterns. A strategy framework is a broader lens for reading the market that several setups can sit inside \u2014 this lesson is a primer, not the full depth (see the Strategies Pack for that).", "image": "framework-why"}, {"heading": "ICT-inspired concepts", "body": "A family of ideas centred on liquidity \u2014 where clusters of stop losses likely sit, and how price is drawn toward them before reversing. You've already seen a piece of this in the liquidity sweep trap.", "image": "framework-ict"}, {"heading": "SMC (Smart Money Concepts) structure", "body": "A framework built around identifying where larger participants are likely positioned, using structure breaks and order-flow-style reasoning rather than indicators.", "image": "framework-smc"}, {"heading": "Momentum continuation", "body": "A framework focused on trading in the direction of established momentum rather than looking for reversals \u2014 the opposite instinct to trading every level as a turning point.", "image": "framework-momentum"}], "quiz": [{"question": "What is a 'strategy framework' as distinct from one of the 5 core setups?", "options": ["Exactly the same thing, just a different name", "A broader lens for reading the market that multiple individual setups can operate within", "A type of candlestick pattern", "A leverage tier"], "correctIndex": 1, "explanation": "A framework is a bigger-picture approach to reading the market \u2014 setups are specific patterns; a framework is the lens you view many patterns through."}, {"question": "Which core concept from this course connects directly to ICT-inspired thinking?", "options": ["Compression breakout body size", "The liquidity sweep / false break trap", "The 1% risk rule", "Candlestick colour"], "correctIndex": 1, "explanation": "Liquidity sweeps \u2014 price pushing through a level to clear out stop losses before reversing \u2014 are a foundational ICT-inspired idea you already met as a trap pattern."}, {"question": "What does 'momentum continuation' focus on, in contrast to reversal-based setups like Setup 1?", "options": ["Trading in the direction of established momentum rather than looking for turning points", "Only trading during news spikes", "Ignoring all structure entirely", "Trading exclusively on the 1-minute timeframe"], "correctIndex": 0, "explanation": "Where Setup 1 looks for reversals at a level, momentum continuation looks the other way \u2014 trading with an already-established directional move."}]}], "tyk": {"passThreshold": 70, "items": [{"image": "chart-setup4", "candidateLabels": ["Setup 4: Multi-Timeframe Confluence", "Setup 5: Compression Breakout", "Liquidity Sweep", "Counter-Trend Trap", "News-Simulation Spike"], "correctLabels": ["Setup 4: Multi-Timeframe Confluence"], "explanation": "1H level, 5M structure shift, and 5M confirmation all present together.", "remediationLessons": ["c5l1"]}, {"image": "chart-setup5", "candidateLabels": ["Setup 4: Multi-Timeframe Confluence", "Setup 5: Compression Breakout", "Liquidity Sweep", "Counter-Trend Trap", "News-Simulation Spike"], "correctLabels": ["Setup 5: Compression Breakout"], "explanation": "Compression, a conviction breakout candle, and 15M alignment together.", "remediationLessons": ["c5l2"]}, {"image": "chart-liquiditysweep", "candidateLabels": ["Setup 4: Multi-Timeframe Confluence", "Setup 5: Compression Breakout", "Liquidity Sweep", "Counter-Trend Trap", "News-Simulation Spike"], "correctLabels": ["Liquidity Sweep"], "explanation": "An aggressive sweep through clustered stops, followed by reversal \u2014 not a valid break.", "remediationLessons": ["c5l3"]}, {"image": "chart-advcountertrend", "candidateLabels": ["Setup 4: Multi-Timeframe Confluence", "Setup 5: Compression Breakout", "Liquidity Sweep", "Counter-Trend Trap", "News-Simulation Spike"], "correctLabels": ["Counter-Trend Trap"], "explanation": "The local pattern is clean, but fights a well-established higher-timeframe trend.", "remediationLessons": ["c5l3"]}, {"image": "chart-newsspike", "candidateLabels": ["Setup 4: Multi-Timeframe Confluence", "Setup 5: Compression Breakout", "Liquidity Sweep", "Counter-Trend Trap", "News-Simulation Spike"], "correctLabels": ["News-Simulation Spike"], "explanation": "Volatility without any structural basis \u2014 not a Setup 5 breakout.", "remediationLessons": ["c5l3"]}, {"image": "scenario-withinbudget", "candidateLabels": ["Within Risk Budget", "Exceeds Risk Budget", "+2R Outcome", "-1R Outcome", "Margin Call"], "correctLabels": ["Within Risk Budget"], "explanation": "Under the 2% single-trade warning threshold \u2014 within budget.", "remediationLessons": ["c5l4"]}, {"image": "scenario-exceedsbudget", "candidateLabels": ["Within Risk Budget", "Exceeds Risk Budget", "+2R Outcome", "-1R Outcome", "Margin Call"], "correctLabels": ["Exceeds Risk Budget"], "explanation": "Above the 2% single-trade threshold \u2014 a risk-budget warning case.", "remediationLessons": ["c5l4"]}, {"image": "scenario-plus2r", "candidateLabels": ["Within Risk Budget", "Exceeds Risk Budget", "+2R Outcome", "-1R Outcome", "Margin Call"], "correctLabels": ["+2R Outcome"], "explanation": "$10 profit against $5 risked is twice the risk \u2014 a +2R result.", "remediationLessons": ["c5l4"]}, {"image": "scenario-minus1r", "candidateLabels": ["Within Risk Budget", "Exceeds Risk Budget", "+2R Outcome", "-1R Outcome", 443.6\" y2=\"64.8\" stroke=\"#33c9a3\" stroke-width=\"1.6\" opacity=\"0.55\"/>\n<rect x=\"432.2\" y=\"25.3\" width=\"22.8\" height=\"34.7\" fill=\"#33c9a3\" opacity=\"0.55\" rx=\"1\"/>\n</g>\n</svg>"}</script>

<script>
(function(){
  "use strict";
  const CONTENT = JSON.parse(document.getElementById('content-data').textContent).courses;
  const ASSETS = JSON.parse(document.getElementById('assets-data').textContent);
  const PASS_QUIZ = 2; // out of 3
  const PASS_TYK_PCT = 70;

  // ---------------- persistence (per-viewer convenience only) ----------------
  const STORE_KEY = 'tradewise_proto_v1';
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { entitlements:{ course_advanced:false }, lessons:{}, tyk:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  let state = loadState();
  state.entitlements = state.entitlements || { course_advanced:false };
  state.lessons = state.lessons || {};
  state.tyk = state.tyk || {};

  // ---------------- navigation ----------------
  let route = { view:'catalogue' };
  function nav(r){ route = r; window.scrollTo({top:0, behavior:'instant'}); render(); }

  // ---------------- helpers ----------------
  function courseById(id){ return CONTENT.find(c=>c.id===id); }
  function lessonById(course, lessonId){ return course.lessons.find(l=>l.id===lessonId); }
  function isUnlocked(course){ return !course.paywalled || state.entitlements.course_advanced; }
  function lessonProgress(lessonId){ return state.lessons[lessonId] || { viewed:false, quizPassed:false, bestScore:0 }; }
  function courseCompletedLessons(course){ return course.lessons.filter(l=>lessonProgress(l.id).quizPassed).length; }
  function courseAllLessonsPassed(course){ return courseCompletedLessons(course) === course.lessons.length; }
  function tykState(courseId){ return state.tyk[courseId] || { attempts:0, bestPct:0, passed:false }; }
  function icon(name, size){
    size = size || 16;
    const inner = {
      lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      check:'<polyline points="4 13 9 18 20 6"/>',
      target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/>',
      chevron:'<polyline points="9 6 15 12 9 18"/>',
      mark:'<path d="M4 17 L11 4 L14 10 L20 6 L15 20 Z" fill="white" stroke="none" opacity="0.95"/>',
    }[name] || '';
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;flex:none;display:inline-block">${inner}</svg>`;
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function svgOf(key){ return ASSETS[key] || ''; }

  function tierLabel(t){ return t==='basic'?'Basic':(t==='intermediate'?'Intermediate':'Advanced'); }
  function tierPillClass(t){ return t==='basic'?'pill-basic':(t==='intermediate'?'pill-intermediate':'pill-advanced'); }

  // ---------------- render root ----------------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = topbarHtml() + bodyHtml() + footerHtml();
    wireGlobal();
    if(route.view==='course') wireCourse();
    if(route.view==='lesson') wireLesson();
    if(route.view==='quiz') wireQuiz();
    if(route.view==='tyk') wireTyk();
  }

  function topbarHtml(){
    const unlocked = state.entitlements.course_advanced;
    return `
    <div class="topbar">
      <div class="brand" style="cursor:pointer" id="brand-home">
        <div class="brand-mark">${icon('mark')}</div>
        <div>
          <div class="brand-name">TradeWise Courses</div>
          <div class="brand-sub">MARKET FOUNDATIONS &rarr; ADVANCED STRATEGIES</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="demo-banner" title="Prototype only — the shipped app wires this to RevenueCat entitlements, not a toggle.">
          ${icon('lock')} Demo entitlement:
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="ent-toggle" ${unlocked?'checked':''} style="accent-color:var(--gold)"> Advanced course unlocked
          </label>
        </div>
        <button class="btn" id="btn-tyk-all">${icon('target')} Test Your Knowledge — All Courses</button>
      </div>
    </div>`;
  }

  function footerHtml(){
    return `<footer class="app-footer">
      <span>TradeWise Course Prototype — content sourced from CONTENT_SPEC.md &amp; COURSE_CATALOGUE.md</span>
      <span>Quiz pass: 2/3 &middot; Test Your Knowledge pass: ${PASS_TYK_PCT}%</span>
    </footer>`;
  }

  function bodyHtml(){
    if(route.view==='catalogue') return catalogueHtml();
    if(route.view==='course') return courseHtml(courseById(route.courseId));
    if(route.view==='lesson') return lessonHtml(courseById(route.courseId), route.lessonId, route.slideIndex||0);
    if(route.view==='quiz') return quizHtml(courseById(route.courseId), route.lessonId);
    if(route.view==='tyk') return tykHtml(route.courseId);
    return '';
  }

  // ---------------- catalogue ----------------
  function catalogueHtml(){
    const cards = CONTENT.map(c=>{
      const unlocked = isUnlocked(c);
      const done = courseCompletedLessons(c);
      const pct = Math.round(done/c.lessons.length*100);
      return `
      <div class="course-card ${unlocked?'':'locked'}" data-course="${c.id}">
        ${unlocked?'':`<div class="lock-badge">${icon('lock')}</div>`}
        <span class="pill ${tierPillClass(c.tier)}">${tierLabel(c.tier)}${c.paywalled?' · '+c.price.split(' ')[0]:''}</span>
        <h3>${esc(c.title)}</h3>
        <div class="desc">${esc(c.description)}</div>
        <div class="course-meta"><span>${c.lessons.length} lessons</span><span class="mono">${done}/${c.lessons.length}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    return `
    <div class="catalogue-head">
      <h1 style="font-size:26px;">Course Catalogue</h1>
      <p>Basic and all three Intermediate courses are free. The Advanced course — multi-timeframe confluence, the advanced trap library, and strategy frameworks — unlocks with a one-time purchase or TradeWise Pro.</p>
    </div>
    <div class="course-grid">${cards}</div>`;
  }

  // ---------------- course detail ----------------
  function courseHtml(c){
    const unlocked = isUnlocked(c);
    if(!unlocked){
      const rows = c.lessons.map((l,i)=>`
        <div class="lesson-row ${i===0?'':'disabled'}" ${i===0?`data-lesson="${l.id}"`:''}>
          <div class="lesson-num">${i===0?icon('chevron'):icon('lock')}</div>
          <div class="lesson-title">${esc(l.title)}</div>
          <div class="lesson-status">${i===0?'Preview':'Locked'}</div>
        </div>`).join('');
      return `
      ${crumbs(c.title)}
      <div class="course-header">
        <div><h1 style="font-size:24px;">${esc(c.title)}</h1><div class="desc">${esc(c.description)}</div></div>
      </div>
      <div class="lock-panel" style="margin-bottom:24px;">
        ${icon('lock',32)}
        <h3>Advanced course — locked</h3>
        <div class="price mono">${esc(c.price)}</div>
        <p style="color:var(--subtext);font-size:13px;max-width:44ch;">Preview the first lesson free below. Unlocking gives you all ${c.lessons.length} lessons and the Advanced Test Your Knowledge assessment.</p>
        <button class="btn btn-gold" id="btn-unlock-advanced">${icon('lock')} Unlock Advanced Course (demo)</button>
      </div>
      <div class="lesson-list">${rows}</div>`;
    }
    const rows = c.lessons.map((l,i)=>{
      const p = lessonProgress(l.id);
      return `
      <div class="lesson-row ${p.quizPassed?'passed':''}" data-lesson="${l.id}">
        <div class="lesson-num">${p.quizPassed?icon('check'):(i+1)}</div>
        <div class="lesson-title">${esc(l.title)}</div>
        <div class="lesson-status">${p.quizPassed?`Passed &middot; ${p.bestScore}/3`:(p.viewed?'In progress':'Not started')}</div>
      </div>`;
    }).join('');
    const allPassed = courseAllLessonsPassed(c);
    const tk = tykState(c.id);
    return `
    ${crumbs(c.title)}
    <div class="course-header">
      <div><h1 style="font-size:24px;">${esc(c.title)}</h1><div class="desc">${esc(c.description)}</div></div>
      <div class="badge-callout">${icon('target')}<span>On completion: <b>${esc(c.badgeName)}</b></span></div>
    </div>
    <div class="lesson-list">${rows}</div>
    <div class="tyk-card">
      <div>
        <h3>Test Your Knowledge — ${esc(c.title)}</h3>
        <p>${c.tyk.items.length} prompted images &middot; ${PASS_TYK_PCT}% to pass ${tk.attempts?`&middot; best score: ${tk.bestPct}% ${tk.passed?'(passed)':''}`:''}</p>
      </div>
      <button class="btn ${allPassed?'btn-primary':''}" id="btn-start-tyk" ${allPassed?'':'disabled'} title="${allPassed?'':'Pass every lesson quiz in this course first'}">
        ${icon('target')} ${tk.attempts?'Retry':'Start'} Test Your Knowledge
      </button>
    </div>`;
  }

  function crumbs(courseTitle){
    return `<div class="crumbs"><button id="crumb-home">Catalogue</button> ${icon('chevron')} <span>${esc(courseTitle)}</span></div>`;
  }

  // ---------------- lesson slide viewer ----------------
  function lessonHtml(c, lessonId, slideIndex){
    const l = lessonById(c, lessonId);
    const slide = l.slides[slideIndex];
    const dots = l.slides.map((_,i)=>`<div class="slide-dot ${i===slideIndex?'active':(i<slideIndex?'done':'')}"></div>`).join('');
    const isLast = slideIndex === l.slides.length - 1;
    return `
    ${crumbs(c.title)}
    <div class="stage">
      <div class="eyebrow" style="margin-bottom:6px;">${esc(c.title).toUpperCase()} &middot; LESSON</div>
      <h2 style="font-size:19px;margin-bottom:14px;">${esc(l.title)}</h2>
      <div class="slide-progress">${dots}</div>
      <div class="slide-body">
        <div class="slide-illustration">${svgOf(slide.image)}</div>
        <div class="slide-text">
          <h2>${esc(slide.heading)}</h2>
          <p>${esc(slide.body)}</p>
        </div>
      </div>
      <div class="stage-nav">
        <button class="btn" id="slide-prev" ${slideIndex===0?'disabled':''}>&larr; Back</button>
        <span class="dots-count">${slideIndex+1} / ${l.slides.length}</span>
        <button class="btn btn-primary" id="slide-next">${isLast?`Start Quiz ${icon('chevron')}`:`Next ${icon('chevron')}`}</button>
      </div>
    </div>`;
  }

  // ---------------- quiz ----------------
  function quizHtml(c, lessonId){
    const l = lessonById(c, lessonId);
    const submitted = !!route.quizSubmitted;
    const answers = route.quizAnswers || [];
    let score = 0;
    if(submitted) l.quiz.forEach((q,i)=>{ if(answers[i]===q.correctIndex) score++; });
    const passed = score >= PASS_QUIZ;
    const qsHtml = l.quiz.map((q,qi)=>{
      const opts = q.options.map((opt,oi)=>{
        let cls = 'quiz-opt';
        if(!submitted && answers[qi]===oi) cls += ' selected';
        if(submitted){
          if(oi===q.correctIndex) cls += ' correct';
          else if(answers[qi]===oi) cls += ' incorrect';
        }
        return `<label class="${cls}" data-q="${qi}" data-o="${oi}">
          <input type="radio" name="q${qi}" ${answers[qi]===oi?'checked':''} ${submitted?'disabled':''}> <span>${esc(opt)}</span>
        </label>`;
      }).join('');
      const explain = submitted ? `<div class="quiz-explain">${esc(q.explanation)}</div>` : '';
      return `<div class="quiz-q"><h4>${qi+1}. ${esc(q.question)}</h4>${opts}${explain}</div>`;
    }).join('');
    const allAnswered = answers.length === l.quiz.length && answers.every(a=>a!==undefined && a!==null);
    return `
    ${crumbs(c.title)}
    <div class="stage">
      <div class="eyebrow" style="margin-bottom:6px;">${esc(l.title).toUpperCase()} &middot; QUIZ</div>
      <h2 style="font-size:19px;margin-bottom:18px;">Check your understanding</h2>
      ${submitted?`<div class="quiz-result-banner ${passed?'pass':'fail'}">${passed?icon('check'):icon('lock')} <span><b>${score}/3</b> — ${passed?'Passed. Nice work.':'Not quite — review the explanations below, then retry.'}</span></div>`:''}
      ${qsHtml}
      <div class="stage-nav">
        <button class="btn" id="quiz-back">&larr; Back to slides</button>
        ${submitted
          ? `<button class="btn btn-primary" id="quiz-continue">${passed?`Continue ${icon('chevron')}`:`Retry Quiz ${icon('chevron')}`}</button>`
          : `<button class="btn btn-primary" id="quiz-submit" ${allAnswered?'':'disabled'}>Submit Answers</button>`}
      </div>
    </div>`;
  }

  // ---------------- test your knowledge ----------------
  function buildTykItems(courseId){
    if(courseId==='ALL'){
      let items = [];
      CONTENT.forEach(c=>{ if(isUnlocked(c)) items = items.concat(c.tyk.items.map(it=>({...it, sourceCourse:c.id}))); });
      return items;
    }
    const c = courseById(courseId);
    return c.tyk.items.map(it=>({...it, sourceCourse:courseId}));
  }
  function shuffled(arr, seedKey){
    // deterministic shuffle per route so re-render doesn't reshuffle mid-attempt
    const a = arr.slice();
    let seed = 0; for(const ch of seedKey) seed = (seed*31 + ch.charCodeAt(0)) % 100000;
    function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function tykHtml(courseId){
    const isAll = courseId==='ALL';
    const title = isAll ? 'Test Your Knowledge — All Courses' : courseById(courseId).title;
    const items = buildTykItems(courseId);
    const seedKey = 'tyk-'+courseId+'-'+(route.tykAttempt||0);
    const order = route.tykOrder || (route.tykOrder = shuffled(items.map((it,i)=>i), seedKey+'-order'));
    const selections = route.tykSelections || (route.tykSelections = {}); // realIdx -> array of chosen label strings
    const submitted = !!route.tykSubmitted;

    if(!submitted){
      const pos = Math.min(route.tykIndex||0, order.length-1);
      const realIdx = order[pos];
      const it = items[realIdx];
      const chosen = new Set(selections[realIdx] || []);
      const chips = it.candidateLabels.map(lab=>{
        const on = chosen.has(lab) ? 'chosen' : '';
        return `<button type="button" class="tyk-chip ${on}" data-label="${esc(lab)}">${chosen.has(lab)?'&#10003; ':''}${esc(lab)}</button>`;
      }).join('');
      const isLast = pos === order.length-1;
      return `
      <div class="crumbs"><button id="crumb-home">Catalogue</button> ${icon('chevron')} <span>${esc(title)}</span></div>
      <div class="tyk-header">
        <h1 style="font-size:22px;">${esc(title)}</h1>
        <p style="color:var(--subtext);font-size:13.5px;max-width:60ch;margin-top:6px;">One image at a time. Select every label that genuinely applies — some images have just one, others have more. ${order.length} images &middot; ${PASS_TYK_PCT}% required to pass.</p>
      </div>
      <div class="tyk-progress">Item ${pos+1} of ${order.length}</div>
      <div class="tyk-prompt-card">
        <div class="tyk-prompt-illustration">${svgOf(it.image)}</div>
        <div>
          <div class="tyk-prompt-hint">Which of these apply to this image?</div>
          <div class="tyk-chip-row">${chips}</div>
        </div>
      </div>
      <div class="tyk-footer">
        <span class="tyk-hint">${chosen.size} selected</span>
        <div style="display:flex;gap:10px;">
          ${pos>0 ? `<button class="btn" id="tyk-prev">Back</button>` : ''}
          <button class="btn btn-primary" id="tyk-next">${isLast?'Finish':'Next'}</button>
        </div>
      </div>`;
    }

    // ---- submitted: scored review ----
    let correctDecisions = 0, totalDecisions = 0;
    const missedLessons = new Map(); // "courseId::lessonId" -> courseId
    const reviewRows = order.map(realIdx=>{
      const it = items[realIdx];
      const chosen = new Set(selections[realIdx] || []);
      const correctSet = new Set(it.correctLabels);
      let itemAllCorrect = true;
      const decisionRows = it.candidateLabels.map(lab=>{
        totalDecisions++;
        const shouldPick = correctSet.has(lab);
        const wasPicked = chosen.has(lab);
        const rightDecision = shouldPick === wasPicked;
        if(rightDecision) correctDecisions++; else itemAllCorrect = false;
        const cls = rightDecision ? 'decision-ok' : 'decision-miss';
        let mark;
        if(shouldPick && wasPicked) mark = '&#10003; correct — selected';
        else if(shouldPick && !wasPicked) mark = '&#10007; missed — should have selected';
        else if(!shouldPick && wasPicked) mark = '&#10007; incorrect — not a match';
        else mark = 'correctly left unselected';
        return `<div class="tyk-decision ${cls}"><span>${esc(lab)}</span><span class="tyk-decision-mark">${mark}</span></div>`;
      }).join('');
      if(!itemAllCorrect && it.remediationLessons){
        it.remediationLessons.forEach(rid=>missedLessons.set(it.sourceCourse+'::'+rid, it.sourceCourse));
      }
      return `
      <div class="tyk-review-item ${itemAllCorrect?'all-correct':'has-miss'}">
        <div class="tyk-review-illustration">${svgOf(it.image)}</div>
        <div class="tyk-review-body">
          ${decisionRows}
          <div class="miss-explain">${esc(it.explanation)}</div>
        </div>
      </div>`;
    }).join('');

    const pct = Math.round(correctDecisions/totalDecisions*100);
    const passed = pct >= PASS_TYK_PCT;
    const scoreBanner = `
    <div class="result-banner ${passed?'pass':'fail'}">
      <div class="result-score">${pct}%</div>
      <div class="result-text"><b>${correctDecisions}/${totalDecisions} label decisions correct.</b> ${passed?`That's a pass (${PASS_TYK_PCT}%+). Retry any time for a higher score.`:`Below the ${PASS_TYK_PCT}% pass mark — review the lessons below, then retry.`}</div>
    </div>`;
    let remediation = '';
    if(!passed && missedLessons.size){
      const rows = [...missedLessons.entries()].map(([key, cid])=>{
        const [courseId2, lid] = key.split('::');
        const course = courseById(courseId2);
        const lesson = lessonById(course, lid);
        return `<div class="remediation-item"><span>${esc(course.title)} &rarr; ${esc(lesson.title)}</span>
          <button class="btn btn-primary" data-goto-lesson="${courseId2}|${lid}">Review lesson</button></div>`;
      }).join('');
      remediation = `<div class="remediation-list">${rows}</div>`;
    }

    return `
    <div class="crumbs"><button id="crumb-home">Catalogue</button> ${icon('chevron')} <span>${esc(title)}</span></div>
    <div class="tyk-header"><h1 style="font-size:22px;">${esc(title)} — Results</h1></div>
    ${scoreBanner}${remediation}
    <div class="tyk-review-list">${reviewRows}</div>
    <div class="tyk-footer">
      <span class="tyk-hint"></span>
      <button class="btn btn-primary" id="tyk-retry">Retry</button>
    </div>`;
  }

  // ---------------- wiring ----------------
  function wireGlobal(){
    const brand = document.getElementById('brand-home');
    if(brand) brand.onclick = ()=>nav({view:'catalogue'});
    const crumb = document.getElementById('crumb-home');
    if(crumb) crumb.onclick = ()=>nav({view:'catalogue'});
    const ent = document.getElementById('ent-toggle');
    if(ent) ent.onchange = (e)=>{ state.entitlements.course_advanced = e.target.checked; saveState(); render(); };
    const tykAll = document.getElementById('btn-tyk-all');
    if(tykAll) tykAll.onclick = ()=>nav({view:'tyk', courseId:'ALL', tykAttempt:Date.now()});

    document.querySelectorAll('.course-card').forEach(card=>{
      card.onclick = ()=>nav({view:'course', courseId:card.dataset.course});
    });
  }

  function wireCourse(){
    const c = courseById(route.courseId);
    document.querySelectorAll('.lesson-row[data-lesson]').forEach(row=>{
      row.onclick = ()=>nav({view:'lesson', courseId:c.id, lessonId:row.dataset.lesson, slideIndex:0});
    });
    const unlockBtn = document.getElementById('btn-unlock-advanced');
    if(unlockBtn) unlockBtn.onclick = ()=>{ state.entitlements.course_advanced = true; saveState(); render(); };
    const tykBtn = document.getElementById('btn-start-tyk');
    if(tykBtn && !tykBtn.disabled) tykBtn.onclick = ()=>nav({view:'tyk', courseId:c.id, tykAttempt:Date.now()});
  }

  function wireLesson(){
    const c = courseById(route.courseId);
    const l = lessonById(c, route.lessonId);
    const idx = route.slideIndex||0;
    const p = lessonProgress(l.id);
    if(!p.viewed){ state.lessons[l.id] = {...p, viewed:true}; saveState(); }
    const prev = document.getElementById('slide-prev');
    if(prev) prev.onclick = ()=> nav({view:'lesson', courseId:c.id, lessonId:l.id, slideIndex:Math.max(0, idx-1)});
    const next = document.getElementById('slide-next');
    if(next) next.onclick = ()=>{
      if(idx < l.slides.length-1) nav({view:'lesson', courseId:c.id, lessonId:l.id, slideIndex:idx+1});
      else nav({view:'quiz', courseId:c.id, lessonId:l.id, quizAnswers:[]});
    };
  }

  function wireQuiz(){
    const c = courseById(route.courseId);
    const l = lessonById(c, route.lessonId);
    if(!route.quizSubmitted){
      document.querySelectorAll('.quiz-opt').forEach(opt=>{
        opt.onclick = ()=>{
          const qi = +opt.dataset.q, oi = +opt.dataset.o;
          route.quizAnswers = route.quizAnswers || [];
          route.quizAnswers[qi] = oi;
          render();
        };
      });
    }
    const back = document.getElementById('quiz-back');
    if(back) back.onclick = ()=>nav({view:'lesson', courseId:c.id, lessonId:l.id, slideIndex:l.slides.length-1});
    const submit = document.getElementById('quiz-submit');
    if(submit) submit.onclick = ()=>{ route.quizSubmitted = true; render(); };
    const cont = document.getElementById('quiz-continue');
    if(cont) cont.onclick = ()=>{
      let score = 0; l.quiz.forEach((q,i)=>{ if(route.quizAnswers[i]===q.correctIndex) score++; });
      const passed = score>=PASS_QUIZ;
      if(passed){
        state.lessons[l.id] = { viewed:true, quizPassed:true, bestScore:Math.max(score, (lessonProgress(l.id).bestScore||0)) };
        saveState();
        nav({view:'course', courseId:c.id});
      } else {
        nav({view:'quiz', courseId:c.id, lessonId:l.id, quizAnswers:[]});
      }
    };
  }

  function wireTyk(){
    const items = buildTykItems(route.courseId);
    const order = route.tykOrder;

    if(!route.tykSubmitted){
      const pos = Math.min(route.tykIndex||0, order.length-1);
      const realIdx = order[pos];
      document.querySelectorAll('.tyk-chip[data-label]').forEach(chip=>{
        chip.onclick = ()=>{
          const lab = chip.dataset.label;
          const sel = route.tykSelections[realIdx] || (route.tykSelections[realIdx] = []);
          const at = sel.indexOf(lab);
          if(at>=0) sel.splice(at,1); else sel.push(lab);
          render();
        };
      });
      const prev = document.getElementById('tyk-prev');
      if(prev) prev.onclick = ()=>{ route.tykIndex = Math.max(0, pos-1); render(); };
      const next = document.getElementById('tyk-next');
      if(next) next.onclick = ()=>{
        if(pos < order.length-1){
          route.tykIndex = pos+1; render();
        } else {
          route.tykSubmitted = true;
          let correctDecisions = 0, totalDecisions = 0;
          items.forEach((it, ri)=>{
            const chosen = new Set(route.tykSelections[ri] || []);
            const correctSet = new Set(it.correctLabels);
            it.candidateLabels.forEach(lab=>{
              totalDecisions++;
              if(correctSet.has(lab) === chosen.has(lab)) correctDecisions++;
            });
          });
          const pct = Math.round(correctDecisions/totalDecisions*100);
          const passed = pct >= PASS_TYK_PCT;
          const key = route.courseId;
          const prevBest = tykState(key).bestPct || 0;
          state.tyk[key] = { attempts:(tykState(key).attempts||0)+1, bestPct:Math.max(pct, prevBest), passed: passed || tykState(key).passed };
          saveState();
          render();
        }
      };
      return;
    }

    const retryBtn = document.getElementById('tyk-retry');
    if(retryBtn) retryBtn.onclick = ()=>nav({view:'tyk', courseId:route.courseId, tykAttempt:Date.now()});
    document.querySelectorAll('[data-goto-lesson]').forEach(btn=>{
      btn.onclick = ()=>{ const [cid,lid] = btn.dataset.gotoLesson.split('|'); nav({view:'lesson', courseId:cid, lessonId:lid, slideIndex:0}); };
    });
  }

  render();
})();
</script>
