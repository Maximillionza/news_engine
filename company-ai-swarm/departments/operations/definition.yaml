# Department definition. Schema: Specifications/1 - enterprise-architecture/Department Operating Model Specification (DOMS).md
# MVP department — canonical per MVP Validation Specification (MVS). Houses the Review Agent
# (quality assurance / validation), matching the MVS four-agent MVP roster.

department:
  id: operations
  name: "Operations Department"
  purpose: "Process management, quality assurance, and execution monitoring."
  leader: operations_head_001
  mission: "Validate outputs and monitor workflow execution across the enterprise."
  # Aligned to agents/active/review_agent/agent.yaml (Phase 5 capability-naming fix,
  # see departments/research/definition.yaml for the full explanation).
  capabilities:
    - validation
    - evaluation
    - improvement_recommendations
  roles: []
  # Value must match agents/active/review_agent/agent.yaml's identity.id exactly.
  agents:
    - review_agent_001
  resources: []
  policies: []
  memory_domain: department
  services_provided: []
  dependencies: []
  performance_metrics:
    capability_quality: null
    task_success: null
    response_time: null
  lifecycle_state: proposed
