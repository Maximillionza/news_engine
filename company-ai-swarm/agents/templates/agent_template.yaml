    long_term: false
    department_memory: allowed
    enterprise_memory: restricted
    retention_policy: ""

  tools:
    available: []
    permissions: []
    execution_limits: []
    approval_required: []

  workflow_access:
    allowed: []
    restricted: []
    creation_permission: false

  permissions:
    read: []
    write: []
    execute: []
    approve: []
    communicate: []
    deploy: false

  behaviour:
    communication_style: ""
    decision_style: ""
    risk_tolerance: ""
    escalation_rules: ""
    failure_handling: ""

  security:
    identity_level: ""
    trust_level: ""          # restricted | operational | trusted | enterprise_authority
    audit_required: true
    data_classification: ""
    restrictions: []

  evaluation:
    metrics:
      accuracy: null
      quality: null
      speed: null
      cost: null
