# Universal Agent Definition template.
# Schema sources:
#   Specifications/2 - construction-framework/Agent Definition Language Specification (ADLS).md
#   Specifications/2 - construction-framework/The Company Repository Blueprint Specification (CRBS).md
# This is a TEMPLATE, not a functioning agent. Copy into agents/active/<agent_name>/agent.yaml and fill in.

agent:
  identity:
    id: ""
    name: ""
    version: "1.0"
    created_by: ""
    created_date: ""
    status: draft            # draft | testing | approved | active | improvement | retired

  mission:
    objective: ""
    responsibilities: []
    boundaries: []
    success_definition: ""

  department:
    name: ""                 # must match a department in departments/
