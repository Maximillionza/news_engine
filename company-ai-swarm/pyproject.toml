[project]
name = "the-company"
version = "0.1.0"
description = "The Company - AI Enterprise Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
providers = [
    # Real ModelProvider implementations (shared/providers/) - optional because
    # StubModelProvider needs neither package, and CI must not require API credentials
    # to install or import the codebase. See Documentation/plans/SDK_MIGRATION_PLAN.md
    # Section 4.1.
    "anthropic>=0.75",
    "claude-agent-sdk>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["services", "sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
